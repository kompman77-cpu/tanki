<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Стальной Рубеж">
<title>СТАЛЬНОЙ РУБЕЖ</title>
<style>
html,body{margin:0;padding:0;background:#141a12;overflow:hidden;position:fixed;inset:0}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============================================================
   СТАЛЬНОЙ РУБЕЖ v2 — танковый шутер с видом сверху
   босс закрывает каждую зону · препятствия и серия рубки
   призы: орудие 5 ур. · броня до 5 · звезда · очки
   ============================================================ */
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
let LW=360,LH=560,buf=null,bctx=null,SCALE=2,offX=0,offY=0;
const G={state:'menu',t:0,score:0,best:0,wave:0,lives:3,
 scroll:0,mission:1,spawnT:0,spawnQ:0,waveClearT:0,
 banner:'',bannerT:0,bannerC:'#ffd23f',
 enemies:[],bullets:[],ebullets:[],crates:[],obstacles:[],parts:[],pops:[],rings:[],
 obsT:2.5,streak:0,
 shake:0,flash:0,flashC:'255,120,120',
 boss:null,bossName:'',bossWarn:0,
 P:{x:180,y:0,tx:180,ty:0,cool:0,mg:0,rk:0,gun:1,armor:0,aCd:0,inv:0,star:0,rec:0,aim:-1.57,mgSide:false},
 overBtn:null,muted:false};
try{G.best=parseInt(localStorage.getItem('steelBest')||'0',10)||0;}catch(e){}

function resize(){
 const w=window.innerWidth,h=window.innerHeight;
 const dpr=Math.min(window.devicePixelRatio||1,2);
 cvs.width=Math.round(w*dpr);cvs.height=Math.round(h*dpr);
 cvs.style.width=w+'px';cvs.style.height=h+'px';
 LW=360;
 LH=Math.max(360,Math.min(720,Math.round(LW*h/Math.max(1,w))));
 SCALE=Math.min(cvs.width/LW,cvs.height/LH);
 offX=(cvs.width-LW*SCALE)/2;
 offY=(cvs.height-LH*SCALE)/2;
 buf=document.createElement('canvas');
 buf.width=Math.round(LW*SCALE);buf.height=Math.round(LH*SCALE);
 bctx=buf.getContext('2d');
}
window.addEventListener('resize',resize);

/* ---------- УТИЛИТЫ ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function rr(c,x,y,w,h,r){
 c.beginPath();c.moveTo(x+r,y);
 c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
 c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function drawText(s,x,y,sc,color,align){
 s=String(s).toUpperCase();
 const size=Math.round(9*sc);
 bctx.font='bold '+size+'px system-ui,sans-serif';
 bctx.textBaseline='top';
 const w=bctx.measureText(s).width;
 let xx=x;
 if(align==='center')xx=x-w/2;else if(align==='right')xx=x-w;
 xx=Math.round(xx);y=Math.round(y);
 bctx.lineJoin='round';
 bctx.lineWidth=Math.max(2,size/4.2);
 bctx.strokeStyle='rgba(10,10,6,0.92)';
 bctx.strokeText(s,xx,y);
 bctx.fillStyle=color;bctx.fillText(s,xx,y);
}
function pop(t,x,y,c,sc){G.pops.push({t:t,x:x,y:y,c:c||'#ffe9a8',sc:sc||1,life:1.2,vy:-30});}
function burst(x,y,c,n,pw){
 for(let i=0;i<(n||12);i++){
  const a=Math.random()*6.28,d=rnd(20,110)*(pw||1);
  G.parts.push({x:x,y:y,vx:Math.cos(a)*d,vy:Math.sin(a)*d,
   life:rnd(0.3,0.8),c:c,s:1+Math.floor(Math.random()*3)});
 }
}
function smoke(x,y,n){
 for(let i=0;i<(n||5);i++)
  G.parts.push({x:x+rnd(-6,6),y:y+rnd(-6,6),vx:rnd(-14,14),vy:rnd(-30,-10),
   life:rnd(0.5,1.1),c:'#4a4a44',s:2+Math.floor(Math.random()*2)});
}
function ring(x,y,r,c){G.rings.push({x:x,y:y,r:r,max:r+34,life:1,c:c||'255,190,90'});}
function explode(x,y,big){
 const n=big?42:16;
 burst(x,y,'#ffd23f',n,big?1.4:0.9);
 burst(x,y,'#ff7a2a',n>>1,big?1.1:0.8);
 burst(x,y,'#3a3a34',n>>1,0.6);
 smoke(x,y,big?8:3);
 ring(x,y,big?22:7,big?'255,160,70':'255,190,90');
 G.shake=Math.min(12,(big?10:3)+(G.shake||0));
}

/* ---------- АУДИО ---------- */
let AC=null,master=null,noiseBuf=null,mStep=0,mNext=0;
function initAudio(){
 if(AC)return;
 try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.38;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.15),AC.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  mNext=AC.currentTime+0.1;
  setInterval(musicTick,60);
 }catch(e){}
}
function midi(m){return 440*Math.pow(2,(m-69)/12);}
function tone(f,t0,dur,type,vol,slide){
 if(!AC||G.muted)return;
 try{
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.linearRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(master);
  o.start(t0);o.stop(t0+dur+0.03);
 }catch(e){}
}
function noiseHit(t0,dur,vol,rate,hp){
 if(!AC||G.muted||!noiseBuf)return;
 try{
  const s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=noiseBuf;s.playbackRate.value=rate||1;
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  s.connect(g);
  if(hp){const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;g.connect(f);f.connect(master);}
  else g.connect(master);
  s.start(t0);s.stop(t0+dur+0.02);
 }catch(e){}
}
/* Две свои темы, каждая — свой 32-шаговый цикл.
   Патрульная: Am-G-F-G, тяжёлый шаг. Боевая (босс): ре-минор,
   быстрее, с двойным боем — не пересекается с темой самолётов */
const PADS=[[57,60,64],[55,59,62],[53,57,60],[55,59,62]];
const BPADS=[[50,53,57],[53,57,60],[48,51,55],[50,53,57]];
const MEL_N=[64,0,64,67,69,0,67,64,62,0,64,62,60,0,0,0,
             64,0,64,67,69,0,72,0,71,0,69,67,69,0,0,0];
const BASS_N=[45,0,45,0,45,45,0,45,43,0,43,0,43,43,0,43,
              41,0,41,0,41,41,0,41,43,0,43,0,45,0,45,45];
const MEL_B=[74,0,74,0,77,79,77,0,74,0,74,77,79,0,81,0,
             79,77,75,0,74,0,72,0,74,0,0,0,70,0,0,0];
const BASS_B=[38,38,0,38,38,0,38,38,34,34,0,34,34,0,34,34,
              38,38,0,38,38,0,38,38,41,0,41,0,43,0,43,0];
function musicTick(){
 if(!AC)return;
 if(G.state!=='play')return;
 const boss=!!G.boss;
 const step=boss?0.13:0.17;
 const mel=boss?MEL_B:MEL_N,bass=boss?BASS_B:BASS_N;
 while(mNext<AC.currentTime+0.25){
  const i=mStep%32;
  /* мелодия + октавное эхо */
  if(mel[i]){
   tone(midi(mel[i]),mNext,step*0.85,'sawtooth',0.026);
   tone(midi(mel[i]+12),mNext+step*0.5,step*0.45,'triangle',0.01);
  }
  /* бас — маршевый шаг */
  if(bass[i])tone(midi(bass[i]),mNext,step*1.35,'triangle',0.055);
  /* пэд-орган — аккорд на такт из 8 шагов */
  if(i%8===0){
   const ch=(boss?BPADS:PADS)[Math.floor(i/8)%4];
   for(const n of ch)tone(midi(n),mNext,step*8,'sawtooth',0.011);
   tone(midi(ch[0]-12),mNext,step*8,'sine',0.02);
  }
  /* барабаны: бочка, марш-малый, у босса двойной бой, хай-хэт */
  if(i%8===0)noiseHit(mNext,0.09,0.06,0.28);
  if(i%8===4)noiseHit(mNext,0.05,0.05,2.2,900);
  if(boss&&i%8===6)noiseHit(mNext,0.04,0.04,2.2,900);
  if(i%2===1)noiseHit(mNext,0.02,0.012,6,5000);
  mStep++;mNext+=step;
 }
}
const sShot=()=>{tone(140,AC.currentTime,0.09,'square',0.07,60);noiseHit(AC.currentTime,0.06,0.05,0.8);};
const sMg=()=>tone(900,AC.currentTime,0.03,'square',0.022,500);
const sRk=()=>{noiseHit(AC.currentTime,0.25,0.05,0.9);tone(300,AC.currentTime,0.2,'sawtooth',0.04,700);};
const sHit=()=>tone(260,AC.currentTime,0.04,'square',0.04,140);
const sCrush=()=>{tone(90,AC.currentTime,0.1,'sawtooth',0.05,40);noiseHit(AC.currentTime,0.12,0.05,0.6);};
const sBoom=()=>{if(!AC||G.muted)return;noiseHit(AC.currentTime,0.3,0.14,0.4);tone(120,AC.currentTime,0.25,'sawtooth',0.08,40);};
const sBoomBig=()=>{if(!AC||G.muted)return;noiseHit(AC.currentTime,0.7,0.2,0.3);tone(80,AC.currentTime,0.6,'sawtooth',0.12,30);};
const sPow=()=>{if(!AC||G.muted)return;const t=AC.currentTime;[72,76,79,84].forEach((m,i)=>tone(midi(m),t+i*0.05,0.09,'triangle',0.08));};
const sAlarm=()=>{if(!AC||G.muted)return;const t=AC.currentTime;for(let i=0;i<3;i++){tone(660,t+i*0.4,0.16,'sawtooth',0.06);tone(440,t+i*0.4+0.18,0.16,'sawtooth',0.06);}};
const sHurt=()=>{if(!AC||G.muted)return;noiseHit(AC.currentTime,0.25,0.14,0.5);tone(180,AC.currentTime,0.2,'square',0.09,60);};
const sUp=()=>{if(!AC||G.muted)return;const t=AC.currentTime;[79,84,88].forEach((m,i)=>tone(midi(m),t+i*0.05,0.1,'square',0.08));};

/* ---------- МИССИИ ---------- */
function missionName(m){return ['ПЕРЕДОВАЯ','ЗЕЛЁНАЯ ЗОНА','ЗИМНИЙ ФРОНТ'][(m-1)%3];}
function reset(){
 G.t=0;G.score=0;G.wave=0;G.lives=3;G.scroll=0;G.mission=1;
 G.enemies=[];G.bullets=[];G.ebullets=[];G.crates=[];G.obstacles=[];G.parts=[];G.pops=[];G.rings=[];
 G.obsT=2.5;G.streak=0;
 G.shake=0;G.flash=0;G.boss=null;G.bossName='';G.bossWarn=0;
 G.spawnT=0;G.spawnQ=0;G.waveClearT=0;
 G.P.x=LW/2;G.P.y=LH-80;G.P.tx=LW/2;G.P.ty=LH-80;
 G.P.cool=0;G.P.mg=0;G.P.rk=0;G.P.gun=1;G.P.armor=0;G.P.aCd=0;G.P.inv=2;G.P.star=0;G.P.rec=0;
 G.banner='';G.bannerT=0;
 nextWave();
}
/* Босс всегда закрывает зону: на волнах 5, 10, 15... идёт бой,
   следующая зона включается только после его гибели (nextWave) */
function nextWave(){
 G.wave++;
 const m=Math.ceil(G.wave/5);
 if(G.wave%5===0){
  const nm=['СТАЛЬНОЙ ГРОМ','МАМОНТ','КРЕМЕНЬ'][(m-1)%3];
  G.bossName=nm;
  G.bossWarn=2.2;sAlarm();
  G.banner='!! БОСС ЗОНЫ: '+nm+' !!';G.bannerT=2.2;G.bannerC='#ff6a6a';
  G.spawnQ=0;
  G.waveClearT=0;
 }else{
  if(m!==G.mission){
   G.mission=m;
   G.banner='МИССИЯ '+((m-1)%3+1)+': '+missionName(m);
   G.bannerT=2.6;G.bannerC='#ffd23f';
  }else{G.banner='ВОЛНА '+G.wave;G.bannerT=1.6;G.bannerC='#cfe8ff';}
  G.spawnQ=Math.min(22,8+G.wave*2);
  G.spawnT=0.7;
  /* два ящика со снаряжением ждут на земле в начале волны */
  for(let i=0;i<2;i++)
   G.crates.push({x:rnd(30,LW-30),y:-30-i*60,k:crateKind(),ph:Math.random()*6.28});
 }
}
/* сборка ящика: сначала то, чего ещё нет у танка, потом звезда/очки/экипаж */
function crateKind(){
 const pool=[];
 if(G.P.gun<2)pool.push('g','g','g');
 if(G.P.gun<3)pool.push('m','m');
 if(G.P.gun<4)pool.push('r');
 if(G.P.gun<5)pool.push('h');
 if(G.P.armor<5)pool.push('a','a','a');
 pool.push('s','$','$','+');
 return pool[Math.floor(Math.random()*pool.length)];
}
/* ---------- СПАВН ВРАГОВ (сильнее с каждой миссией) ---------- */
function spawnEnemy(){
 const mm=(G.mission-1)%3,lvl=G.mission,r=Math.random();
 const hpM=1+0.35*(lvl-1);
 const ftM=Math.max(0.55,1-0.1*(lvl-1));
 const vM=1+0.12*(lvl-1);
 if(G.wave%5===0&&G.boss)return;
 if(mm>=2&&r<0.16){
  G.enemies.push({k:'hv',x:rnd(40,LW-40),y:-34,vy:26*vM,vx:rnd(-10,10),ph:Math.random()*6.28,hp:Math.round(9*hpM),r:17,fl:0,t:0,ft:rnd(1.6,2.4)*ftM});
 }else if(mm>=1&&r<0.42){
  G.enemies.push({k:'med',x:rnd(36,LW-36),y:-30,vy:32*vM,vx:0,ph:Math.random()*6.28,hp:Math.round(4*hpM),r:14,fl:0,t:0,ft:rnd(1.6,2.6)*ftM});
 }else{
  G.enemies.push({k:'lite',x:rnd(30,LW-30),y:-26,vy:rnd(38,52)*vM,vx:0,ph:Math.random()*6.28,hp:Math.round(2*hpM),r:12,fl:0,t:0,ft:rnd(2,3.6)*ftM});
 }
}
function spawnBoss(){
 const lvl=Math.ceil(G.wave/5);
 const type=(lvl-1)%3,tier=Math.floor((lvl-1)/3);
 const hpBase=[60,85,115][type]+lvl*[45,55,65][type];
 G.boss={x:LW/2,y:-110,ty:120,vx:(type===1?30:22)*(Math.random()<0.5?1:-1),t:0,
  hp:hpBase,maxhp:hpBase,lvl:lvl,type:type,tier:tier,
  bw:[56,62,64][type],bh:[34,36,38][type],
  fl:0,aT:1.6,aB:3.4,aS:6,aM:4,aR:7,spA:0,dying:0,dt2:0,entered:0,chgT:undefined,mgB:0};
}
function eShoot(x,y,vx,vy){G.ebullets.push({x:x,y:y,vx:vx,vy:vy,r:4});}
function eRocket(x,y,vx,vy){G.ebullets.push({x:x,y:y,vx:vx,vy:vy,r:4.6,h:1,life:5});}

/* ---------- ОГОНЬ ИГРОКА ---------- */
function firePlayer(){
 const P=G.P,a=P.aim,sx=Math.cos(a),sy=Math.sin(a);
 P.rec=0.12;
 if(P.gun===1){
  G.bullets.push({x:P.x+sx*20,y:P.y+sy*20,vx:sx*300,vy:sy*300,dmg:1,k:0});
  P.cool=0.55;
 }else if(P.gun===2){
  const ox=Math.cos(a+1.57)*7,oy=Math.sin(a+1.57)*7;
  G.bullets.push({x:P.x+ox+sx*20,y:P.y+oy+sy*20,vx:sx*300,vy:sy*300,dmg:1,k:0});
  G.bullets.push({x:P.x-ox+sx*20,y:P.y-oy+sy*20,vx:sx*300,vy:sy*300,dmg:1,k:0});
  P.cool=0.5;
 }else if(P.gun===3){
  G.bullets.push({x:P.x+sx*20,y:P.y+sy*20,vx:sx*300,vy:sy*300,dmg:1,k:0});
  P.cool=0.5;
 }else{
  /* тяжёлое орудие: снаряд вдвое мощнее */
  G.bullets.push({x:P.x+sx*20,y:P.y+sy*20,vx:sx*320,vy:sy*320,dmg:2,k:0,big:1});
  P.cool=0.48;
 }
 sShot();
}
function fireMg(){
 const P=G.P;
 P.mgSide=!P.mgSide;
 const a=P.aim+(P.mgSide?0.12:-0.12);
 const sx=Math.cos(a),sy=Math.sin(a);
 const ox=Math.cos(a+1.57)*(P.mgSide?11:-11),oy=Math.sin(a+1.57)*(P.mgSide?11:-11);
 G.bullets.push({x:P.x+ox,y:P.y+oy,vx:sx*420,vy:sy*420,dmg:0.35,k:1});
 P.mg=0.11;
 sMg();
}
function fireRockets(){
 const P=G.P,dmg=P.gun>=5?4:3;
 for(let s=-1;s<=1;s+=2){
  const ox=Math.cos(P.aim+1.57)*15*s,oy=Math.sin(P.aim+1.57)*15*s;
  G.bullets.push({x:P.x+ox,y:P.y+oy,vx:Math.cos(P.aim+s*0.35)*200,vy:Math.sin(P.aim+s*0.35)*200,dmg:dmg,k:2,h:1,life:3});
 }
 P.rk=1.7;
 sRk();
}
function dropCrate(x,y){
 const r=Math.random(),m=(G.mission-1)%3;
 let k;
 if(m===0)k=r<0.45?'g':r<0.65?'a':r<0.82?'s':r<0.92?'$':'+';
 else if(m===1)k=r<0.2?'m':r<0.32?'r':r<0.5?'a':r<0.68?'s':r<0.9?'$':'+';
 else k=r<0.18?'h':r<0.36?'r':r<0.56?'a':r<0.74?'s':r<0.93?'$':'+';
 if((k==='g'&&G.P.gun>=2)||(k==='m'&&G.P.gun>=3)||(k==='r'&&G.P.gun>=4)||(k==='h'&&G.P.gun>=5))k=Math.random()<0.5?'a':'$';
 G.crates.push({x:x,y:y,vy:48,k:k,ph:Math.random()*6.28});
}
function killEnemy(i){
 const e=G.enemies[i];
 const pts=(e.k==='lite'?80:e.k==='med'?180:400)+G.mission*20;
 G.score+=pts;
 explode(e.x,e.y,e.k!=='lite');
 pop('+'+pts,e.x,e.y-12,'#ffd23f',e.k==='hv'?1.2:0.9);
 sBoom();
 const ch=e.k==='lite'?0.22:e.k==='med'?0.42:0.65;
 if(Math.random()<ch)dropCrate(e.x,e.y);
 G.enemies.splice(i,1);
}
function hurtPlayer(){
 const P=G.P;
 if(P.star>0)return;
 if(P.inv>0)return;
 if(P.aCd<=0&&P.armor>0){
  P.armor--;P.aCd=6;P.inv=1;
  burst(P.x,P.y,'#c8d8c0',14);ring(P.x,P.y,14,'200,220,190');
  pop('БРОНЯ ДЕРЖИТ (ОСТ. '+P.armor+')',P.x,P.y-30,'#c8d8c0',0.9);
  sPow();G.flash=0.3;G.flashC='200,220,190';
  return;
 }
 G.lives--;
 P.inv=2.2;G.flash=0.5;G.flashC='255,120,120';G.shake=12;
 explode(P.x,P.y,false);sHurt();
 if(P.gun>1)P.gun--;
 if(G.lives<=0){
  explode(P.x,P.y,true);sBoomBig();
  if(G.score>G.best){G.best=G.score;try{localStorage.setItem('steelBest',String(G.best));}catch(e){}}
  G.state='over';
 }
}
/* ============ КОНЕЦ ЧАСТИ 1 — дальше часть 2 ============ */
/* ============ ЧАСТЬ 2 ============ */

/* ---------- ОБНОВЛЕНИЕ ---------- */
function update(dt){
 G.t+=dt;
 const P=G.P;
 G.scroll+=48*dt;

 /* наводка башни: босс — приоритет, иначе ближайший враг */
 let bestD=1e9,bestA=P.aim;
 if(G.boss&&!G.boss.dying&&G.boss.entered){
  const d=Math.hypot(G.boss.x-P.x,G.boss.y-P.y);
  bestD=d;bestA=Math.atan2(G.boss.y-P.y,G.boss.x-P.x);
 }else{
  for(const e of G.enemies){
   const d=Math.hypot(e.x-P.x,e.y-P.y);
   if(d<bestD&&e.y<P.y+10){bestD=d;bestA=Math.atan2(e.y-P.y,e.x-P.x);}
  }
 }
 let da=bestA-P.aim;
 while(da>Math.PI)da-=6.283;
 while(da<-Math.PI)da+=6.283;
 P.aim+=da*Math.min(1,10*dt);

 /* корпус — медленный танковый ход */
 const kx=(P.tx-P.x),ky=(P.ty-P.y);
 const spd=Math.min(1,6.5*dt);
 P.x+=kx*spd;P.y+=ky*spd;
 P.x=clamp(P.x,18,LW-18);P.y=clamp(P.y,64,LH-42);
 P.inv=Math.max(0,P.inv-dt);
 P.aCd=Math.max(0,P.aCd-dt);
 P.cool-=dt;P.mg-=dt;P.rk-=dt;
 P.rec=Math.max(0,P.rec-dt);
 P.star=Math.max(0,P.star-dt);
 if(P.cool<=0)firePlayer();
 if(P.gun>=3&&P.mg<=0)fireMg();
 if(P.gun>=4&&P.rk<=0)fireRockets();

 /* предупреждение о боссе */
 if(G.bossWarn>0){
  G.bossWarn-=dt;
  if(G.bossWarn<=0)spawnBoss();
 }

 /* спавн врагов — только вне боя с боссом */
 if(!G.boss&&G.spawnQ>0){
  G.spawnT-=dt;
  if(G.spawnT<=0){
   spawnEnemy();G.spawnQ--;
   G.spawnT=rnd(0.5,1.1)*Math.max(0.5,1-G.wave*0.04);
  }
 }
 /* смена зоны — только после гибели босса и без предупреждения */
 if(!G.boss&&G.bossWarn<=0&&G.spawnQ<=0&&G.enemies.length===0){
  G.waveClearT-=dt;
  if(G.waveClearT<=0){nextWave();G.waveClearT=1.4;}
 }else G.waveClearT=1.4;

 /* --- ПРЕПЯТСТВИЯ --- */
 G.obsT-=dt;
 if(G.obsT<=0){
  G.obsT=rnd(1.2,2.6);
  const r=Math.random(),m=(G.mission-1)%3;
  let k;
  if(m===0)k=r<0.4?'wire':r<0.7?'fence':'rock';
  else if(m===1)k=r<0.35?'wire':r<0.65?'fence':r<0.8?'rock':'barrel';
  else k=r<0.3?'wire':r<0.55?'fence':r<0.75?'rock':'barrel';
  G.obstacles.push({k:k,x:rnd(24,LW-24),y:-30,t:0,crushT:0,crushed:false});
 }
 for(let i=G.obstacles.length-1;i>=0;i--){
  const o=G.obstacles[i];
  o.t+=dt;o.y+=48*dt;
  if(o.crushT>0){o.crushT-=dt;if(o.crushT<=0){G.obstacles.splice(i,1);continue;}}
  if(o.y>LH+34){G.obstacles.splice(i,1);continue;}
  /* давка гусеницами */
  if(!o.crushed&&Math.abs(o.x-P.x)<20&&Math.abs(o.y-P.y)<16){
   o.crushed=true;o.crushT=0.3;
   G.streak++;
   const pts=o.k==='barrel'?50:o.k==='rock'?80:60;
   G.score+=pts;
   if(o.k==='barrel'){
    explode(o.x,o.y,false);sBoom();
    if(Math.random()<0.3)dropCrate(o.x,o.y);
   }else{
    burst(o.x,o.y,o.k==='wire'?'#8a8a7a':'#8a7a58',10);sCrush();
   }
   pop('+'+pts,o.x,o.y-10,'#cfe8ff',0.8);
   if(G.streak===10){
    G.score+=500;pop('СЕРИЯ РУБКИ! +500',P.x,P.y-42,'#ffd23f',1.4);
    ring(P.x,P.y,16,'255,210,90');sPow();
   }else if(G.streak>10&&G.streak%10===0){
    G.score+=250;pop('СЕРИЯ +250',P.x,P.y-42,'#ffd23f',1);
   }
  }else if(o.y>P.y+26&&!o.crushed&&G.streak>0){
   G.streak=0; /* пропустил — серия сброшена */
  }
 }

 /* --- ПУЛИ ИГРОКА --- */
 for(let i=G.bullets.length-1;i>=0;i--){
  const b=G.bullets[i];
  if(b.h){
   b.life-=dt;
   /* наведение ракеты: босс приоритетнее */
   let tx=null,ty=null,bd=1e9;
   if(G.boss&&!G.boss.dying){
    const d=Math.hypot(G.boss.x-b.x,G.boss.y-b.y);
    if(d<bd){bd=d;tx=G.boss.x;ty=G.boss.y;}
   }
   for(const e of G.enemies){
    const d=Math.hypot(e.x-b.x,e.y-b.y);
    if(d<bd){bd=d;tx=e.x;ty=e.y;}
   }
   if(tx!==null){
    const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1;
    b.vx+=dx/d*260*dt;b.vy+=dy/d*260*dt;
    const sp=Math.hypot(b.vx,b.vy);
    if(sp>290){b.vx*=290/sp;b.vy*=290/sp;}
   }
   if(Math.random()<0.5)
    G.parts.push({x:b.x,y:b.y,vx:rnd(-8,8),vy:rnd(-8,8),life:0.4,c:'#8a8a80',s:1});
   if(b.life<=0){
    G.bullets.splice(i,1);
    ring(b.x,b.y,10,'255,160,70');
    continue;
   }
  }
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y<-14||b.y>LH+14||b.x<-10||b.x>LW+10){G.bullets.splice(i,1);continue;}
  /* попадание по боссу */
  if(G.boss&&!G.boss.dying){
   const B=G.boss;
   if(Math.abs(b.x-B.x)<B.bw&&Math.abs(b.y-B.y)<B.bh){
    B.hp-=b.dmg;B.fl=0.1;
    burst(b.x,b.y,'#ffd23f',3,0.5);sHit();
    if(b.k===2){
     ring(b.x,b.y,12,'255,160,70');
     for(const e of G.enemies)
      if(Math.hypot(e.x-b.x,e.y-b.y)<44)e.hp-=1;
     sBoom();
    }
    G.bullets.splice(i,1);
    if(B.hp<=0){B.dying=1;B.dt2=0;}
    continue;
   }
  }
  /* по врагам */
  let done=false;
  for(let j=G.enemies.length-1;j>=0;j--){
   const e=G.enemies[j];
   if(Math.abs(b.x-e.x)<e.r+3&&Math.abs(b.y-e.y)<e.r+5){
    e.hp-=b.dmg;e.fl=0.1;
    burst(b.x,e.y-2,'#ffd23f',3,0.4);sHit();
    if(b.k===2){
     ring(b.x,b.y,12,'255,160,70');
     for(const o of G.enemies)
      if(o!==e&&Math.hypot(o.x-b.x,o.y-b.y)<44)o.hp-=1;
     sBoom();
    }
    if(e.hp<=0)killEnemy(j);
    done=true;break;
   }
  }
  if(done)G.bullets.splice(i,1);
 }

 /* --- СНАРЯДЫ ВРАГОВ --- */
 for(let i=G.ebullets.length-1;i>=0;i--){
  const b=G.ebullets[i];
  if(b.h){
   b.life-=dt;
   if(b.life<=0){G.ebullets.splice(i,1);continue;}
   const dx=P.x-b.x,dy=P.y-b.y,d=Math.hypot(dx,dy)||1;
   b.vx+=dx/d*130*dt;b.vy+=dy/d*130*dt;
   const sp=Math.hypot(b.vx,b.vy);
   if(sp>165){b.vx*=165/sp;b.vy*=165/sp;}
  }
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y>LH+12||b.y<-14||b.x<-12||b.x>LW+12){G.ebullets.splice(i,1);continue;}
  if(Math.abs(b.x-P.x)<9&&Math.abs(b.y-P.y)<11){
   G.ebullets.splice(i,1);
   hurtPlayer();
   if(G.state==='over')return;
  }
 }

 /* --- ВРАГИ --- */
 for(let i=G.enemies.length-1;i>=0;i--){
  const e=G.enemies[i];
  e.t+=dt;e.fl=Math.max(0,e.fl-dt);
  if(e.k==='lite'){
   e.y+=e.vy*dt;
   e.x+=Math.sin(e.t*1.6+e.ph)*22*dt;
   e.ft-=dt;
   if(e.ft<=0&&e.y>0){
    e.ft=rnd(2.4,4);
    eShoot(e.x,e.y+12,0,160);
   }
  }else if(e.k==='med'){
   e.y+=e.vy*dt;
   e.x+=clamp(P.x-e.x,-40,40)*0.5*dt;
   e.ft-=dt;
   if(e.ft<=0&&e.y>0&&e.y<LH*0.72){
    e.ft=rnd(2,3.2);
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
    eShoot(e.x,e.y+13,dx/d*185,dy/d*185);
   }
  }else{ /* hv */
   e.y+=e.vy*dt;
   e.x+=e.vx*dt;
   if(e.x<34||e.x>LW-34)e.vx*=-1;
   e.ft-=dt;
   if(e.ft<=0&&e.y>0&&e.y<LH*0.75){
    e.ft=rnd(2.2,3);
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx);
    for(let k=-1;k<=1;k++)
     eShoot(e.x,e.y+15,Math.cos(a+k*0.28)*170,Math.sin(a+k*0.28)*170);
   }
  }
  if(Math.random()<0.03)smoke(e.x,e.y-14,1);
  if(e.y>LH+34){G.enemies.splice(i,1);continue;}
  /* таран: со звездой — раздавить врага, без — получить урон */
  if(Math.abs(e.x-P.x)<e.r+9&&Math.abs(e.y-P.y)<e.r+11){
   if(P.star>0){
    G.score+=150;
    pop('РАМ! +150',e.x,e.y-14,'#ffe97a',1);
    explode(e.x,e.y,false);sBoom();
    G.enemies.splice(i,1);
   }else{
    explode(e.x,e.y,false);sBoom();
    G.enemies.splice(i,1);
    hurtPlayer();
    if(G.state==='over')return;
   }
  }
 }

 /* --- ЯЩИКИ СО СНАРЯЖЕНИЕМ --- */
 for(let i=G.crates.length-1;i>=0;i--){
  const d=G.crates[i];
  d.y+=d.vy*dt;
  if(d.y>LH+18){G.crates.splice(i,1);continue;}
  if(Math.abs(d.x-P.x)<17&&Math.abs(d.y-P.y)<19){
   if(d.k==='g'){
    if(P.gun<2){P.gun=2;pop('ОРУДИЕ: СПАРЕННОЕ',P.x,P.y-32,'#ffd23f',1);sUp();}
    else{G.score+=200;pop('+200',d.x,d.y-10,'#ffd23f',1);sPow();}
   }else if(d.k==='m'){
    if(P.gun<3){P.gun=3;pop('ПУЛЕМЁТ УСТАНОВЛЕН',P.x,P.y-32,'#ffd23f',1);sUp();}
    else{G.score+=250;pop('+250',d.x,d.y-10,'#ffd23f',1);sPow();}
   }else if(d.k==='r'){
    if(P.gun<4){P.gun=4;pop('РАКЕТЫ ЗАРЯЖЕНЫ',P.x,P.y-32,'#ff8a3c',1.1);sUp();}
    else{G.score+=300;pop('+300',d.x,d.y-10,'#ffd23f',1);sPow();}
   }else if(d.k==='h'){
    if(P.gun<5){P.gun=5;pop('ТЯЖЁЛОЕ ОРУДИЕ!',P.x,P.y-32,'#ff6a6a',1.1);sUp();}
    else{G.score+=400;pop('+400',d.x,d.y-10,'#ffd23f',1);sPow();}
   }else if(d.k==='a'){
    if(P.armor<5){P.armor++;pop('БРОНЯ +1 (ВСЕГО '+P.armor+')',P.x,P.y-32,'#c8d8c0',1);sUp();}
    else{G.score+=250;pop('+250',d.x,d.y-10,'#ffd23f',1);sPow();}
   }else if(d.k==='s'){
    P.star=8;pop('ЗВЕЗДА! НЕУЯЗВИМОСТЬ',P.x,P.y-32,'#ffe97a',1.2);sPow();
    ring(P.x,P.y,18,'255,230,130');
   }else if(d.k==='$'){
    G.score+=500;pop('+500',d.x,d.y-10,'#ffd23f',1.1);sPow();
   }else{
    G.lives=Math.min(5,G.lives+1);pop('+1 ЭКИПАЖ',P.x,P.y-32,'#7fdd8a',1.1);sPow();
   }
   G.crates.splice(i,1);
  }
 }

 if(G.boss)updateBoss(dt);

 /* --- ЧАСТИЦЫ --- */
 for(let i=G.parts.length-1;i>=0;i--){
  const p=G.parts[i];
  p.x+=p.vx*dt;p.y+=(p.vy+30)*dt;
  p.vx*=(1-1.6*dt);p.vy*=(1-1.6*dt);
  p.life-=dt;
  if(p.life<=0)G.parts.splice(i,1);
 }
 for(let i=G.rings.length-1;i>=0;i--){
  const r=G.rings[i];
  r.r+=(r.max-r.r)*6*dt;r.life-=dt*2.2;
  if(r.life<=0)G.rings.splice(i,1);
 }
 for(let i=G.pops.length-1;i>=0;i--){
  const p=G.pops[i];p.y+=p.vy*dt;p.life-=dt;
  if(p.life<=0)G.pops.splice(i,1);
 }
 G.shake=Math.max(0,G.shake-dt*16);
 G.flash=Math.max(0,G.flash-dt*2.2);
 if(G.bannerT>0)G.bannerT-=dt;
}

/* ---------- БОССЫ ---------- */
function updateBoss(dt){
 const B=G.boss;
 B.t+=dt;B.fl=Math.max(0,B.fl-dt);
 if(B.dying){
  B.dt2+=dt;
  if(Math.random()<0.5){
   const ex=B.x+rnd(-44,44),ey=B.y+rnd(-22,22);
   burst(ex,ey,'#ff9a3c',8);ring(ex,ey,6,'255,150,60');
  }
  if(B.dt2>1.3){
   explode(B.x,B.y,true);
   explode(B.x-38,B.y+8,true);
   explode(B.x+38,B.y-6,true);
   sBoomBig();
   const pts=1000+B.type*700+B.lvl*500;
   G.score+=pts;
   pop('БОСС ПОВЕРЖЕН +'+pts,LW/2,LH*0.35,'#ffd23f',1.6);
   for(let i=0;i<4;i++)dropCrate(B.x+rnd(-40,40),B.y+rnd(-10,10));
   G.boss=null;
  }
  return;
 }
 /* въезд на поле боя */
 if(!B.entered){
  B.y+=34*dt;
  if(B.y>=B.ty)B.entered=1;
  return;
 }
 const enr=B.hp<B.maxhp*0.4?0.6:1;
 const aim=Math.atan2(G.P.y-B.y,G.P.x-B.x);
 if(B.type===0){
  /* СТАЛЬНОЙ ГРОМ: дрейф, веер прицельных, круговой залп, миньоны */
  B.x+=B.vx*dt;
  if(B.x<62){B.x=62;B.vx=Math.abs(B.vx);}
  if(B.x>LW-62){B.x=LW-62;B.vx=-Math.abs(B.vx);}
  B.aT-=dt*enr;
  if(B.aT<=0){B.aT=rnd(1.7,2.3);B.chgT=0.5;}
  if(B.chgT!==undefined&&B.chgT>0){
   B.chgT-=dt;
   if(B.chgT<=0){
    B.chgT=undefined;
    const n=5;
    for(let i=0;i<n;i++){
     const a=aim+(i-(n-1)/2)*0.17;
     eShoot(B.x,B.y+28,Math.cos(a)*150,Math.sin(a)*150);
    }
    tone(220,AC.currentTime,0.1,'sawtooth',0.05,110);
   }
  }
  B.aB-=dt*enr;
  if(B.aB<=0){
   B.aB=rnd(3,3.8);
   const n=12,off=Math.random()*6.28;
   for(let i=0;i<n;i++){
    const a=off+i/n*6.28;
    eShoot(B.x+Math.cos(a)*22,B.y+Math.sin(a)*16,Math.cos(a)*100,Math.sin(a)*100+25);
   }
   tone(160,AC.currentTime,0.14,'sawtooth',0.06,80);
  }
  B.aS-=dt*enr;
  if(B.aS<=0){
   B.aS=rnd(6,8);
   G.enemies.push({k:'lite',x:B.x+rnd(-46,46),y:B.y+14,vy:38,vx:0,ph:Math.random()*6.28,hp:2,r:12,fl:0,t:0,ft:rnd(2,3.4)});
  }
 }else if(B.type===1){
  /* МАМОНТ: двойной прицел + мортирный веер + средние танки */
  B.x+=B.vx*dt;
  if(B.x<72){B.x=72;B.vx=Math.abs(B.vx);}
  if(B.x>LW-72){B.x=LW-72;B.vx=-Math.abs(B.vx);}
  B.y=B.ty+Math.sin(B.t*0.9)*14;
  B.aT-=dt*enr;
  if(B.aT<=0){
   B.aT=rnd(1.5,2.1);
   for(let i=-1;i<=1;i+=2)
    eShoot(B.x+i*14,B.y+28,Math.cos(aim+i*0.06)*185,Math.sin(aim+i*0.06)*185);
   tone(280,AC.currentTime,0.08,'square',0.05,140);
  }
  B.aB-=dt*enr;
  if(B.aB<=0){
   B.aB=rnd(2.8,3.6);
   const n=7;
   for(let i=0;i<n;i++){
    const a=Math.PI/2+(i-(n-1)/2)*0.2;
    eShoot(B.x,B.y+30,Math.cos(a)*115,Math.sin(a)*115);
   }
   tone(130,AC.currentTime,0.16,'sawtooth',0.06,60);
  }
  B.aS-=dt*enr;
  if(B.aS<=0){
   B.aS=rnd(6.5,8.5);
   G.enemies.push({k:'med',x:B.x+rnd(-44,44),y:B.y+18,vy:30,vx:0,ph:Math.random()*6.28,hp:4,r:14,fl:0,t:0,ft:rnd(1.8,2.8)});
  }
 }else{
  /* КРЕМЕНЬ: спиральный поток + тяжёлый радиальный залп */
  B.x+=B.vx*0.5*dt;
  if(B.x<76){B.x=76;B.vx=Math.abs(B.vx);}
  if(B.x>LW-76){B.x=LW-76;B.vx=-Math.abs(B.vx);}
  B.y=B.ty+Math.sin(B.t*0.7)*12;
  B.aT-=dt*enr;
  if(B.aT<=0){
   B.aT=rnd(1,1.3);
   B.spA+=0.7;
   for(let i=0;i<3;i++){
    const a=B.spA+i*2.09;
    eShoot(B.x,B.y,Math.cos(a)*120,Math.sin(a)*120);
   }
  }
  B.aB-=dt*enr;
  if(B.aB<=0){B.aB=rnd(3.4,4.2);B.chgT=0.6;}
  if(B.chgT!==undefined&&B.chgT>0){
   B.chgT-=dt;
   if(B.chgT<=0){
    B.chgT=undefined;
    const n=16,off=Math.random()*6.28;
    for(let i=0;i<n;i++){
     const a=off+i/n*6.28;
     eShoot(B.x+Math.cos(a)*24,B.y+Math.sin(a)*24,Math.cos(a)*110,Math.sin(a)*110);
    }
    tone(110,AC.currentTime,0.2,'sawtooth',0.08,50);
   }
  }
  B.aS-=dt*enr;
  if(B.aS<=0){
   B.aS=rnd(7,9);
   for(let i=0;i<2;i++)
    G.enemies.push({k:'lite',x:B.x+rnd(-50,50),y:B.y+20,vy:36,vx:0,ph:Math.random()*6.28,hp:2,r:12,fl:0,t:0,ft:rnd(2,3.4)});
  }
 }
 /* === ДОП. ОРУЖИЕ ПОВТОРНЫХ ВСТРЕЧ === */
 if(B.tier>=1){
  /* спаренный пулемёт: очередь из 6 пар снарядов */
  if(B.mgB>0){
   B.mgT-=dt;
   if(B.mgT<=0){
    B.mgT=0.14;
    B.mgB--;
    eShoot(B.x-30,B.y+22,Math.cos(aim+0.12)*230,Math.sin(aim+0.12)*230);
    eShoot(B.x+30,B.y+22,Math.cos(aim-0.12)*230,Math.sin(aim-0.12)*230);
    noiseHit(AC.currentTime,0.03,0.03,2.4,800);
   }
  }else{
   B.aM-=dt*enr;
   if(B.aM<=0){B.aM=rnd(3.6,4.6);B.mgB=6;B.mgT=0;}
  }
 }

   S.fillStyle='#ff8a3c';S.fillRect(-59,-7,4,3);S.fillRect(55,-7,4,3);

function drawObstacles(){
 const S=bctx,m=(G.mission-1)%3;
 for(const o of G.obstacles){
  const x=Math.round(o.x),y=Math.round(o.y);
  if(o.crushed){
   /* смятое — остался след и обломки */
   S.fillStyle='rgba(30,30,22,0.45)';
   S.beginPath();S.ellipse(x,y,22,10,0,0,7);S.fill();
   S.fillStyle='#4a4434';
   for(let i=0;i<4;i++)
    S.fillRect(x-14+i*8,y-3+h1(o.t+i)*5,3,2);
   continue;
  }
  if(o.k==='wire'){
   /* колючая проволока: столбики и нитки */
   S.fillStyle='#4a4234';
   S.fillRect(x-20,y-2,3,8);S.fillRect(x+17,y-2,3,8);
   S.strokeStyle='#8a8a7a';S.lineWidth=1;
   S.beginPath();S.moveTo(x-20,y);S.lineTo(x+20,y+1);S.stroke();
   S.beginPath();S.moveTo(x-20,y+4);S.lineTo(x+20,y+5);S.stroke();
   S.strokeStyle='#5a5848';
   for(let i=-3;i<=3;i++){
    S.beginPath();S.moveTo(x+i*6,y-1);S.lineTo(x+i*6+3,y+6);S.stroke();
   }
  }else if(o.k==='fence'){
   /* заборчик: доски */
   S.fillStyle=m===2?'#7a6a4a':'#6a5232';
   for(let i=-2;i<=2;i++)S.fillRect(x+i*8-2.5,y-8,5,16);
   S.fillStyle=m===2?'#5a4c34':'#4a3a20';
   S.fillRect(x-20,y-3,40,3);
   S.strokeStyle='rgba(20,14,6,0.7)';S.lineWidth=1;
   S.fillRect(x-20,y-3,40,3);
   S.strokeRect(x-21,y-9,42,18);
  }else if(o.k==='rock'){
   /* валун */
   S.fillStyle='rgba(10,15,8,0.3)';
   S.beginPath();S.ellipse(x+2,y+4,13,7,0,0,7);S.fill();
   S.fillStyle='#6a6458';
   S.beginPath();S.ellipse(x,y,12,9,0.3,0,7);S.fill();
   S.fillStyle='#8a8478';
   S.beginPath();S.ellipse(x-3,y-3,7,5,0.3,0,7);S.fill();
   S.strokeStyle='#4a463c';S.lineWidth=1;
   S.beginPath();S.ellipse(x,y,12,9,0.3,0,7);S.stroke();
   if(m===2){
    S.fillStyle='#f0f6fc';
    S.beginPath();S.ellipse(x-2,y-5,8,3.5,0.3,0,7);S.fill();
   }
  }else{
   /* бочка — красная, взрывается */
   const bg=S.createLinearGradient(x-8,0,x+8,0);
   bg.addColorStop(0,'#a83434');bg.addColorStop(0.5,'#d84848');bg.addColorStop(1,'#7a1e1e');
   S.fillStyle=bg;
   rr(S,x-8,y-9,16,18,3);S.fill();
   S.strokeStyle='#4a1212';S.lineWidth=1.4;S.stroke();
   S.fillStyle='#e8d84a';
   S.fillRect(x-8,y-4,16,3);S.fillRect(x-8,y+2,16,3);
  }
 }
}

function render(){

/* ---------- УПРАВЛЕНИЕ ---------- */
function pt(e){
 const r=cvs.getBoundingClientRect();
 const dx=(e.clientX-r.left)*(cvs.width/r.width);
 const dy=(e.clientY-r.top)*(cvs.height/r.height);
 return{x:(dx-offX)/SCALE,y:(dy-offY)/SCALE};
}
function startFullscreen(){
 try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}catch(err){}
}
cvs.addEventListener('pointerdown',function(e){
 e.preventDefault();
 initAudio();
 if(AC&&AC.state==='suspended')AC.resume();
 const p=pt(e);
 if(G.state==='menu'){
  if(p.x>=G.menuBtn.x&&p.x<=G.menuBtn.x+G.menuBtn.w&&p.y>=G.menuBtn.y&&p.y<=G.menuBtn.y+G.menuBtn.h){
   startFullscreen();
   initDecor();reset();G.state='play';
  }
  return;
 }
 if(G.state==='over'){
  if(p.x>=G.overBtn.x&&p.x<=G.overBtn.x+G.overBtn.w&&p.y>=G.overBtn.y&&p.y<=G.overBtn.y+G.overBtn.h){
   startFullscreen();
   initDecor();reset();G.state='play';
  }
  return;
 }
 G.P.tx=p.x;G.P.ty=p.y-38;
 G.dragOn=true;
});
cvs.addEventListener('pointermove',function(e){
 if(G.state!=='play'||!G.dragOn)return;
 const p=pt(e);
 G.P.tx=clamp(p.x,18,LW-18);
 G.P.ty=clamp(p.y-38,64,LH-42);
});
window.addEventListener('pointerup',function(){G.dragOn=false;});
const keys={};
window.addEventListener('keydown',function(e){
 initAudio();
 if(e.code==='KeyM'){G.muted=!G.muted;return;}
 if((G.state==='menu'||G.state==='over')&&(e.code==='Space'||e.code==='Enter')){
  startFullscreen();
  initDecor();reset();G.state='play';return;
 }
 keys[e.code]=true;
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
cvs.addEventListener('contextmenu',function(e){e.preventDefault();});

/* тач-резерв для старых Android: включается только там,
   где нет PointerEvent, на новых телефонах блок молчит */
if(!window.PointerEvent){
 cvs.addEventListener('touchstart',function(e){
  e.preventDefault();initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  const p=pt(e.touches[0]);
  if(G.state==='menu'){
   if(p.x>=G.menuBtn.x&&p.x<=G.menuBtn.x+G.menuBtn.w&&p.y>=G.menuBtn.y&&p.y<=G.menuBtn.y+G.menuBtn.h){
    startFullscreen();
    initDecor();reset();G.state='play';
   }
   return;
  }
  if(G.state==='over'){
   if(p.x>=G.overBtn.x&&p.x<=G.overBtn.x+G.overBtn.w&&p.y>=G.overBtn.y&&p.y<=G.overBtn.y+G.overBtn.h){
    startFullscreen();
    initDecor();reset();G.state='play';
   }
   return;
  }
  G.P.tx=p.x;G.P.ty=p.y-38;
  G.dragOn=true;
 },{passive:false});
 cvs.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(G.state!=='play'||!G.dragOn)return;
  const p=pt(e.touches[0]);
  G.P.tx=clamp(p.x,18,LW-18);
  G.P.ty=clamp(p.y-38,64,LH-42);
 },{passive:false});
 window.addEventListener('touchend',function(){
  G.dragOn=false;
 },{passive:false});
}

function kbMove(dt){
 const P=G.P,sp=120;
 let dx=0,dy=0;
 if(keys.ArrowLeft||keys.KeyA)dx-=1;
 if(keys.ArrowRight||keys.KeyD)dx+=1;
 if(keys.ArrowUp||keys.KeyW)dy-=1;
 if(keys.ArrowDown||keys.KeyS)dy+=1;
 if(dx||dy){
  P.x+=dx*sp*dt;P.y+=dy*sp*dt;
  P.x=clamp(P.x,18,LW-18);P.y=clamp(P.y,64,LH-42);
  P.tx=P.x;P.ty=P.y;
 }
}

/* ---------- ЦИКЛ ---------- */
resize();
initDecor();
G.P.x=LW/2;G.P.y=LH*0.74;G.P.tx=G.P.x;G.P.ty=G.P.y;
let last=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;
 if(dt>0.06)dt=0.06;
 G.t+=dt;
 if(G.state==='play'){kbMove(dt);update(dt);moveDecor(dt);}
 else moveDecor(dt);
 render();
}
requestAnimationFrame(frame);
</script>
</body>
